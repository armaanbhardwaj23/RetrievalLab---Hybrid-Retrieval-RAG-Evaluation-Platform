[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrievallab"
version = "0.1.0"
description = "A small platform for learning and evaluating hybrid RAG retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.0",
    "openai>=3.13.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
retrievallab = "retrievallab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
